# Verifies on every push (first green run: 2026-10-15):
# backend tests, frontend typecheck/build, Docker image build and the end-to-end UI check against the container.
name: ci
on: [push, pull_request]
permissions:
  contents: write   # the android job publishes the APK as a GitHub release
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt -r requirements-voice.txt
      # real face models (SHA-256 verified) + public test media: a face photo from the OpenCV samples
      # and the JFK speech sample from the faster-whisper repository
      - run: python -m scripts.download_models
      - run: |
          mkdir -p /tmp/media
          curl -sfL -o /tmp/media/face.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          curl -sfL -o /tmp/media/jfk.flac https://raw.githubusercontent.com/SYSTRAN/faster-whisper/master/tests/data/jfk.flac
      - run: |
          set +e
          python -m unittest discover -s backend/tests -t . -v > test.log 2>&1
          code=$?
          tail -5 test.log
          # always report which tests were skipped (real-model tests must NOT be skipped here)
          python -c "import re;t=open('test.log').read();sk=[l for l in t.splitlines() if ' ... skipped' in l];print('::notice title=test summary::'+(re.findall(r'Ran \d+ tests.*',t) or ['?'])[0]+' | skipped: '+('%0A'.join(sk) or 'none'))"
          # surface failures as an annotation (readable via the API even when raw logs are not)
          if [ $code -ne 0 ]; then python -c "import sys;t=open('test.log').read();i=t.find('=====');print('::error title=unit tests::'+t[i:][-6000:].replace('%','%25').replace('\r','').replace('\n','%0A'))"; fi
          exit $code
        env:
          NS_TEST_FACE_IMAGE: /tmp/media/face.jpg
          NS_TEST_SPEECH_FILE: /tmp/media/jfk.flac
          NS_ASR_MODEL: tiny
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
  docker-e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t neuroshield .
      - run: docker run -d -p 8000:8000 --name ns neuroshield
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 2; done
          node scripts/e2e_check.mjs http://127.0.0.1:8000
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: unit tests + APK
        env:
          NS_VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest assembleRelease > build.log 2>&1
          code=$?
          tail -30 build.log
          if [ $code -ne 0 ]; then python3 -c "import re;t=open('build.log').read();e=[l for l in t.splitlines() if l.startswith('e: ') or 'error:' in l or 'FAILED' in l or 'expected' in l][:60];i=t.find('What went wrong');print('::error title=android build::'+('\n'.join(e)+'\n'+t[i:i+2500]).replace('%','%25').replace('\r','').replace('\n','%0A'))"; fi
          exit $code
      - name: test summary
        if: always()
        run: python3 -c "import glob,re;x=''.join(open(f).read() for f in glob.glob('app/build/test-results/**/*.xml',recursive=True));print('::notice title=android tests::tests=%d failures=%d'%(sum(map(int,re.findall(r'tests=\"(\d+)\"',x))),sum(map(int,re.findall(r'failures=\"(\d+)\"',x)))))"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: publish APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=1.0.${{ github.run_number }}
          D=app/build/outputs/apk/release
          cp $D/app-arm64-v8a-release.apk Saqtan-$V-arm64.apk
          cp $D/app-universal-release.apk Saqtan-$V-universal.apk
          cp $D/app-armeabi-v7a-release.apk Saqtan-$V-armeabi-v7a.apk
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest Saqtan-$V-*.apk --title "Saqtan для Android (сборка ${{ github.run_number }})" \
            --notes "Установочные файлы Android-приложения, собраны автоматически из коммита ${{ github.sha }}. Для большинства телефонов: файл -arm64.apk. Если не устанавливается — -universal.apk (подходит всем, но больше). Старые телефоны (32-бит): -armeabi-v7a.apk. Установка: скачайте APK на телефон, откройте и разрешите установку из этого источника." --latest
  android-emulator:
    runs-on: ubuntu-24.04
    needs: [android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: android/app-apk }
      - run: curl -sfL -o android/face.jpg https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg || true
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 3072M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          working-directory: android
          script: ./ci/emulator_smoke.sh
      - name: report
        if: always()
        working-directory: android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "t=open('shots/crash.txt').read() if __import__('os').path.exists('shots/crash.txt') else 'no crash.txt';print('::notice title=emulator::'+t[:3000].replace('%','%25').replace('\r','').replace('\n','%0A'))"
          if [ -f shots/walkthrough-raw.mp4 ]; then
            command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
            ffmpeg -loglevel error -y -i shots/walkthrough-raw.mp4 -vf "scale=540:-2" -c:v libx264 -crf 27 -preset veryfast -pix_fmt yuv420p -movflags +faststart shots/walkthrough.mp4 && rm shots/walkthrough-raw.mp4
          fi
          cd shots && git init -q && git checkout -q -b ci-screens && git add . && \
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "emulator screenshots ${{ github.sha }}" && \
            git push -qf https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} ci-screens

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: generate project
        working-directory: ios
        run: xcodegen
      - name: unit tests (Simulator)
        working-directory: ios
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print([x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')][0]['udid'])")
          xcodebuild test -project NeuroShield.xcodeproj -scheme NeuroShield -destination "id=$UDID" CODE_SIGNING_ALLOWED=NO > test.log 2>&1 \
            && grep -E "Executed [0-9]+ tests" test.log | tail -1 \
            || { grep -E "error:|failed|XCTAssert" test.log | sort -u | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: build app (Simulator)
        working-directory: ios
        run: |
          xcodebuild build -project NeuroShield.xcodeproj -scheme NeuroShield -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -60 | sed 's/^/::error::/'; exit 1; }
      - name: run in Simulator and take screenshots
        working-directory: ios
        run: ./ci/screens.sh
      - name: publish screenshots
        if: always()
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          python3 -c "t=open('shots/status.txt').read() if __import__('os').path.exists('shots/status.txt') else 'no status';print('::notice title=ios-simulator::'+t[:2000].replace('\n','%0A'))"
          cd shots && git init -q && git checkout -q -b ci-screens-ios && git add . && \
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "iOS simulator screenshots ${{ github.sha }}" && \
            git push -qf https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} ci-screens-ios

