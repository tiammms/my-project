# Builds the real-vs-synthetic speech set, trains the small on-phone model, evaluates it and exports ONNX.
# Runs only when the training code changes (or by hand). Results (model, metrics, logs, example clips) are pushed
# to the branch "voice-model-results"; the model the app ships is then copied into the app together with its
# metrics, so every APK build is reproducible and does not depend on this job.
name: voice-model
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ml/voice_spoof/**", ".github/workflows/voice-model.yml"]
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: ml/voice_spoof
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: |
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      # downloads (FLEURS, Piper voices) and, separately, the generated data set: regenerated only when data.py changes
      - uses: actions/cache/restore@v4
        with:
          path: ml/voice_spoof/work/cache
          key: voice-data-${{ hashFiles('ml/voice_spoof/data.py') }}
          restore-keys: voice-data-
      - id: dataset
        uses: actions/cache/restore@v4
        with:
          path: ml/voice_spoof/work/data
          key: voice-dataset-${{ hashFiles('ml/voice_spoof/data.py', 'ml/voice_spoof/channel.py') }}
      - name: Build the data set
        if: steps.dataset.outputs.cache-hit != 'true'
        run: |
          set +e
          timeout 200m python -u data.py --out work/data --cache work/cache 2>&1 | tee data.log | grep --line-buffered '::notice'; code=${PIPESTATUS[0]}
          tail -c 3000 data.log
          exit $code
      - if: always() && steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ml/voice_spoof/work/cache
          key: voice-data-${{ hashFiles('ml/voice_spoof/data.py') }}-${{ github.run_id }}
      - if: success() && steps.dataset.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ml/voice_spoof/work/data
          key: voice-dataset-${{ hashFiles('ml/voice_spoof/data.py', 'ml/voice_spoof/channel.py') }}
      - name: Train, evaluate, export
        run: |
          set +e
          timeout 120m python -u train_eval.py --data work/data --out work/out 2>&1 | tee train.log | grep --line-buffered '::notice'; code=${PIPESTATUS[0]}
          tail -c 3000 train.log
          exit $code
      - name: Publish results to the branch voice-model-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r work/out/. /tmp/res/ 2>/dev/null; cp work/data/counts.json data.log train.log /tmp/res/ 2>/dev/null; true
          cd /tmp/res && git init -q && git checkout -q -b voice-model-results
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "voice model results, run ${{ github.run_id }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-model-results
