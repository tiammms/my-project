# One service serves the API and the dashboard. The image itself is built and tested in CI (job docker-e2e).
services:
  neuroshield:
    build: .
    ports: ["8000:8000"]
    env_file: [.env.example]
    environment:
      NS_DB_PATH: /app/backend/data/neuroshield.db
      NS_CORS_ORIGINS: http://localhost:8000
    volumes: ["ns-data:/app/backend/data"]
volumes:
  ns-data:
